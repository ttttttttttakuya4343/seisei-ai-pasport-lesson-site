<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第3章: 模擬試験 | 生成AIパスポート講座</title>
    <link rel="stylesheet" href="../shared/css/styles.css">
    <style>
        .exam-header { text-align: center; margin-bottom: 2rem; }
        .exam-question { background: white; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); display: none; }
        .exam-question.active { display: block; }
        .exam-options { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .exam-option { padding: 1rem; text-align: left; background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: all 0.2s; }
        .exam-option:hover { background: #e9ecef; }
        .exam-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-dark); }
        .exam-progress { margin: 2rem 0; font-size: 1.2rem; text-align: center; font-weight: bold; color: var(--primary-color); }
        .exam-result { text-align: center; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--secondary-color) var(--percentage), #e9ecef 0); display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; font-size: 2rem; font-weight: bold; position: relative; }
        .score-circle::before { content: ""; position: absolute; width: 120px; height: 120px; background: white; border-radius: 50%; }
        .score-text { position: relative; z-index: 1; color: var(--text-color); }
        .explanation { background: #f8f9fa; padding: 1rem; border-radius: 8px; margin-top: 1rem; text-align: left; border-left: 4px solid var(--secondary-color); }
        .correct-ans { color: #2e7d32; font-weight: bold; }
        .wrong-ans { color: #c62828; font-weight: bold; }
        .result-list { margin-top: 2rem; text-align: left; }
        .result-item { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
        .start-screen { text-align: center; padding: 3rem 0; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 生成AIパスポート講座</h1>
            <div class="nav-links">
                <a href="../index.html">ホーム</a>
                <a href="index.html">第3章トップ</a>
            </div>
        </div>
    </nav>
    <main class="container lesson-layout">
        <div class="lesson-page" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <div class="lesson-header exam-header">
                <div class="hero-badge" style="background-color: var(--secondary-color);">第3章 確認問題</div>
                <h1>模擬試験</h1>
                <p>第3章の全内容から15問が出題されます。記憶力をチェックしましょう！</p>
                <div id="best-score-display" style="margin-top: 1rem; font-weight: bold; color: var(--secondary-dark); display: none;">
                    🏆 最高スコア: <span id="best-score">0</span>/15
                </div>
            </div>

            <div id="start-screen" class="start-screen">
                <div id="unlock-content">
                    <p>準備はいいですか？全問正解を目指して頑張りましょう！</p>
                    <button id="start-btn" class="nav-button" style="font-size: 1.2rem; padding: 1rem 2rem;">試験を開始する</button>
                </div>
            </div>

            <div id="exam-container" style="display: none;">
                <div class="exam-progress">問題 <span id="current-q">1</span> / 15</div>

                <div id="question-area">
                    <!-- 問題がJSで生成されます -->
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="next-btn" class="nav-button" style="display: none;">次の問題へ</button>
                </div>
            </div>

            <div id="result-screen" class="exam-result">
                <h2>試験結果</h2>
                <div class="score-circle" id="score-circle" style="--percentage: 0%;">
                    <span class="score-text" id="final-score">0/15</span>
                </div>
                <h3 id="result-message"></h3>

                <div class="result-list" id="result-list">
                    <h3>回答の振り返り</h3>
                    <!-- 振り返りがJSで生成されます -->
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                    <button onclick="location.reload()" class="nav-button">もう一度挑戦する</button>
                    <a href="../chapter4/index.html" id="next-chapter-btn" class="nav-button" style="display:none;">第4章へ進む →</a>
                    <a href="index.html" class="nav-button secondary">第3章トップへ戻る</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const allQuestions = [
    {
        "q": "オープンソースの画像生成AIは？",
        "options": [
            "A. Midjourney",
            "B. Stable Diffusion",
            "C. DALL-E 3",
            "D. Adobe Firefly"
        ],
        "a": 1,
        "exp": "解説：Stable DiffusionはStability AIが開発したオープンソースの画像生成AIです。詰でも無料で使え、自分のパソコンでも動かせるため、カスタマイズや独自の改良が可能です。"
    },
    {
        "q": "Midjourneyが動作するプラットフォームは？",
        "options": [
            "A. Slack",
            "B. Discord",
            "C. LINE",
            "D. Telegram"
        ],
        "a": 1,
        "exp": "解説：MidjourneyはDiscord上で動作する画像生成AIサービスです。Discordというチャットアプリでテキストを入力すると、芸術的で美しい画像を生成してくれます。"
    },
    {
        "q": "Diffusion Modelの説明として正しいものは？",
        "options": [
            "A. ノイズから徐々に画像を作り出す",
            "B. 画像を分類する",
            "C. 音声を生成する",
            "D. テキストを要約する"
        ],
        "a": 0,
        "exp": "解説：Diffusion Model（拡散モデル）は、ノイズ（ランダムな点）から少しずつきれいな画像を作り出す技術です。砂嵐の画面から徐々に絵が浮かび上がってくるようなイメージです。"
    },
    {
        "q": "OCRの説明として正しいものは？",
        "options": [
            "A. 音声認識技術",
            "B. 画像内の文字をテキストに変換",
            "C. 動画生成技術",
            "D. 自然言語処理"
        ],
        "a": 1,
        "exp": "解説：OCR(Optical Character Recognition)は画像内の文字を認識してテキストデータに変換する技術です。例えば、写真に写った看板の文字を読み取ってコピペできる文字にする技術です。"
    },
    {
        "q": "リップシンクとは？",
        "options": [
            "A. 口の動きと音声を同期させる技術",
            "B. 画像を高解像度化する技術",
            "C. 音楽を生成する技術",
            "D. テキストを音声に変換する技術"
        ],
        "a": 0,
        "exp": "解説：リップシンクは口の動きと音声を同期させる技術です。HeyGenなどの動画AIで使われ、AIアバターが話す時に口の動きと声を自然に合わせています。"
    },
    {
        "q": "データの水増し（Data Augmentation）の目的は？",
        "options": [
            "A. 不要なデータを削除する",
            "B. 学習データの量と多様性を人工的に増やす",
            "C.\n                            データのフォーマットを変換する",
            "D. データを暗号化して安全にする"
        ],
        "a": 1,
        "exp": "解説：データの水増し（Data Augmentation）は、既存のデータに回転、反転、拡大縮小、色調変更などの変換を加えることで、学習データの量と多様性を人工的に増やす手法です。学習データが少ない場合のモデル精度向上に有効です。"
    },
    {
        "q": "Veo3はどの企業が開発した動画生成AIか？",
        "options": [
            "A. OpenAI",
            "B. Google",
            "C. Microsoft",
            "D. Meta"
        ],
        "a": 1,
        "exp": "解説：Veo3はGoogleが開発した動画生成AIモデルです。テキストから高品質な動画を生成することができ、Soraと並ぶ主要な動画生成AIとして注目されています。"
    },
    {
        "q": "画像生成AIの前処理における「正規化」の目的は？",
        "options": [
            "A. 画像の解像度を上げる",
            "B. 画像のファイルサイズを小さくする",
            "C. ピクセル値を一定の範囲にスケーリングする",
            "D. 画像の不要な部分をトリミングする"
        ],
        "a": 2,
        "exp": "解説：正規化は、画像のピクセル値を一定の範囲（例：0〜1）にスケーリングする処理です。これにより、モデルの学習が安定し、収束が速くなります。画像のリサイズ（サイズ統一）と合わせて、重要な前処理ステップです。"
    },
    {
        "q": "音楽生成AIと音声生成AIの違いとして正しいものは？",
        "options": [
            "A. 音楽生成AIはAIを使わない",
            "B.\n                            音声生成AIはテキスト入力を受け付けない",
            "C. 音楽生成AIは楽曲を、音声生成AIは人間の声を生成する",
            "D.\n                            音楽生成AIはクラウド専用で、音声生成AIはローカル専用"
        ],
        "a": 2,
        "exp": "解説：音楽生成AIは楽曲やメロディ、BGMなどの音楽コンテンツを生成するのに対し、音声生成AIは人間の声を合成・模倣する技術です。前者はSunoやUdioなど、後者はElevenLabsやVOICEVOXなどが代表的なサービスです。"
    },
    {
        "q": "以下のうち、生成AIのサービスの説明として正しくないものはどれか？",
        "options": [
            "A.\n                            テキスト生成AIは文章の作成・翻訳・要約ができる",
            "B.\n                            画像生成AIはテキストから画像を作成できる",
            "C. 動画生成AIは長時間の映画を自動で完成させられる",
            "D.\n                            音声生成AIは特定の人物の声を模倣できる"
        ],
        "a": 2,
        "exp": "解説：動画生成AIは進歩していますが、現時点では長時間の映画全体を一度に自動生成することは困難です。SoraやVeo3でもまだ数十秒〜数分程度の短い動画生成が主流です。"
    },
    {
        "q": "ディープフェイクの「Deep」は何の略？",
        "options": [
            "A. ディープラーニング（深層学習）",
            "B. 深い（Depth）",
            "C. 詳細な（Detailed）",
            "D. デジタル（Digital）"
        ],
        "a": 0,
        "exp": "解説：ディープフェイクの「Deep」はディープラーニング（深層学習）の略です。「Fake」（偽物）と組み合わせて、ディープラーニングで作られた偽物コンテンツを意味します。"
    },
    {
        "q": "ディープフェイクの検出で注目される特徴は？",
        "options": [
            "A. 髪の色",
            "B. まばたきの頻度",
            "C. 服装",
            "D. 背景"
        ],
        "a": 1,
        "exp": "解説：ディープフェイクはまばたきの頻度が少ないという特徴があります。その他、首の不自然な動きや、顔と背景の境界線の不自然さなども検出の手がかりになります。"
    },
    {
        "q": "C2PAの目的は？",
        "options": [
            "A. AIの開発速度を上げる",
            "B. コンテンツの真正性を証明",
            "C. 個人情報を保護",
            "D. ネットワーク速度を向上"
        ],
        "a": 1,
        "exp": "解説：C2PA（Coalition for Content Provenance and Authenticity）はコンテンツの出所と真正性を証明する業界標準規格です。Adobe、Microsoft、Google、OpenAIなどが参加しています。"
    },
    {
        "q": "2019年のCEO詐欺事件の被害額は？",
        "options": [
            "A. 約300万円",
            "B. 約3,000万円",
            "C. 約3億円",
            "D. 約30億円"
        ],
        "a": 1,
        "exp": "解説：2019年のイギリスの企業で発生したCEO詐欺事件では、経営者の声を偽造して送金指示が出され、約3,000万円の被害が出ました。ディープフェイクの悪用例として重要な事例です。"
    },
    {
        "q": "ディープフェイクの適正利用で重要なことは？",
        "options": [
            "A. できるだけ多く作成する",
            "B. 本人の同意を得る",
            "C. 秘密にする",
            "D. 無料で提供する"
        ],
        "a": 1,
        "exp": "解説：ディープフェイクを適正に利用するためには、本人の同意を得ることが最も重要です。また、明確にAI生成と表示し、悪意ある用途を避け、プライバシーを尊重することも必要です。"
    },
    {
        "q": "C2PA（Coalition for Content Provenance and Authenticity）の目的は？",
        "options": [
            "A.\n                            コンテンツを暗号化する",
            "B. コンテンツの出所と真正性を証明する",
            "C.\n                            コンテンツの著作権料を自動計算する",
            "D.\n                            コンテンツを自動翻訳する"
        ],
        "a": 1,
        "exp": "解説：C2PA（Coalition for Content Provenance and Authenticity）は、デジタルコンテンツの作成者、作成日時、編集履歴などの来歴情報を記録・検証する標準規格です。これにより、コンテンツが本物かAI生成かを判別しやすくなります。"
    },
    {
        "q": "デジタル電子透かし（Digital Watermark）の特徴は？",
        "options": [
            "A. 画像に大きなロゴを目に見える形で重ねる",
            "B.\n                            ファイルにパスワードをかける",
            "C. 人間には知覚できない形で識別情報を埋め込む",
            "D.\n                            ファイル名に識別番号を付与する"
        ],
        "a": 2,
        "exp": "解説：デジタル電子透かしは、人間の目や耳では知覚できないように、画像や音声、動画のデータ内に識別情報を埋め込む技術です。コンテンツの見た目を変えずに、著作権情報やAI生成であることを示す情報を記録できます。"
    },
    {
        "q": "ディープフェイク検出技術で使われる手法として正しいものは？",
        "options": [
            "A.\n                            文章の文法をチェックする",
            "B.\n                            音声の音量レベルを測定する",
            "C. AIで映像の不自然さ（瞬き、肌の質感等）を分析する",
            "D.\n                            ファイルサイズを比較する"
        ],
        "a": 2,
        "exp": "解説：ディープフェイク検出では、AI（ディープラーニング）を使って映像の不自然さを分析します。瞬きの頻度、肌の質感、光の反射、顔の動きのパターンなど、人間では見落としやすい微細な不自然さをAIが検出します。"
    },
    {
        "q": "音声ディープフェイクのリスクとして最も深刻なものは？",
        "options": [
            "A. 音質が低下する",
            "B.\n                            再生速度が変わる",
            "C. 特定人物の声で電話詐欺や金銭被害を引き起こす",
            "D.\n                            ストレージを大量に消費する"
        ],
        "a": 2,
        "exp": "解説：音声ディープフェイクの最も深刻なリスクは、特定の人物の声を模倣した電話詐欺や金銭的被害です。実際に、CEOの声を模倣した詐欺で大金が振り込まれた事例が報告されています。"
    },
    {
        "q": "ディープフェイクに関する法的規制について、正しくないものはどれか？",
        "options": [
            "A.\n                            他人を騙す目的のディープフェイクは詐欺罪に問われる可能性がある",
            "B. 同意なく他人の顔を使うことは肖像権侵害になり得る",
            "C. ディープフェイク技術の使用は全世界で全面禁止されている",
            "D. 政治的なディープフェイクは選挙に影響を与えるため規制対象となり得る"
        ],
        "a": 2,
        "exp": "解説：ディープフェイク技術自体は映画制作や教育、エンターテインメントなどの正当な用途もあるため、技術の使用自体が全面禁止されているわけではありません。問題となるのは悪意ある使用方法です。"
    },
    {
        "q": "RAGの「R」は何の略？",
        "options": [
            "A. Recursive（再帰的）",
            "B. Retrieval（検索）",
            "C. Random（ランダム）",
            "D. Rapid（高速）"
        ],
        "a": 1,
        "exp": "解説：RAGの「R」はRetrieval（検索）を意味します。RAGはRetrieval-Augmented Generation（検索拡張生成）の略で、外部データベースから関連情報を検索して回答を生成する技術です。"
    },
    {
        "q": "Embeddingとは？",
        "options": [
            "A. 画像を生成する技術",
            "B. テキストをベクトルに変換する技術",
            "C. 音声を認識する技術",
            "D. 動画を編集する技術"
        ],
        "a": 1,
        "exp": "解説：Embedding（埋め込み）はテキストを数値のベクトル（数の並び）に変換する技術です。文章を座標に変換して、似た意味の文章が近くに配置されるようにします。"
    },
    {
        "q": "ハルシネーションとは？",
        "options": [
            "A. AIが高速に動作すること",
            "B. データを圧縮すること",
            "C. 事実でない情報を生成すること",
            "D. 画像を生成すること"
        ],
        "a": 2,
        "exp": "解説：ハルシネーションはAIが事実ではない情報を、あたかも事実であるかのように生成してしまう現象です。例えば、存在しない論文を引用したり、架空の歴史を語ったりすることです。"
    },
    {
        "q": "ベクトルデータベースの例でないものは？",
        "options": [
            "A. Pinecone",
            "B. Weaviate",
            "C. Chroma",
            "D. PostgreSQL"
        ],
        "a": 3,
        "exp": "解説：PostgreSQLは伝統的なリレーショナルデータベースで、ベクトルデータベースではありません。Pinecone、Weaviate、Chromaはすべてベクトルデータベースの例です。"
    },
    {
        "q": "RAGの長所は？",
        "options": [
            "A. モデルサイズが小さい",
            "B. 最新情報を活用できる",
            "C. 学習が不要",
            "D. インターネット接続が不要"
        ],
        "a": 1,
        "exp": "解説：RAGの最大の長所は、データベースを更新すれば最新情報に対応できることです。その他にも、ハルシネーションの削減、情報源の明示、企業独自データの活用などのメリットがあります。"
    },
    {
        "q": "Embedding（埋め込み）の主な目的は？",
        "options": [
            "A.\n                            テキストを暗号化する",
            "B. テキストを意味を保持したベクトル（数値）に変換する",
            "C.\n                            テキストを別の言語に翻訳する",
            "D.\n                            テキストの文字数を圧縮する"
        ],
        "a": 1,
        "exp": "解説：Embedding（埋め込み）は、テキストや画像などのデータを、意味的な関係性を保持したベクトル（数値の並び）に変換する技術です。これにより、類似した内容のデータ同士が近い距離に配置され、意味的な検索が可能になります。"
    },
    {
        "q": "ベクトルデータベースの特徴として正しいものは？",
        "options": [
            "A.\n                            SQLクエリで完全一致検索を行う",
            "B.\n                            テーブル形式でデータを格納する",
            "C. ベクトル間の類似度を計算して近い情報を高速検索する",
            "D. 画像のみを格納する専用データベース"
        ],
        "a": 2,
        "exp": "解説：ベクトルデータベースは、Embeddingで変換されたベクトルデータを格納し、ベクトル間の距離や類似度を高速に計算して、意味的に近い情報を検索する仕組みです。PineconeやChroma、Weaviateなどが代表例です。"
    },
    {

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        const EXAM_QUESTION_COUNT = 15;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const bestScore = localStorage.getItem('chapter3_exam_score');
            if (bestScore) {
                document.getElementById('best-score-display').style.display = 'block';
                document.getElementById('best-score').textContent = bestScore;
            }
            document.getElementById('start-btn').addEventListener('click', startExam);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
        });

        function startExam() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';

            questions = shuffle([...allQuestions]).slice(0, EXAM_QUESTION_COUNT);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            showQuestion();
        }

        function showQuestion() {
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            const q = questions[currentQuestionIndex];

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `<div class="exam-option" onclick="selectExamAnswer(${idx}, this)">${opt}</div>`;
            });

            const area = document.getElementById('question-area');
            area.innerHTML = `
                <div class="exam-question active">
                    <p style="font-size: 1.2rem; margin-bottom: 1.5rem;"><strong>問題:</strong><br>${q.q}</p>
                    <div class="exam-options">
                        ${optionsHtml}
                    </div>
                </div>
            `;
            document.getElementById('next-btn').style.display = 'none';
            window.scrollTo(0, 0);
        }

        window.selectExamAnswer = function (optIndex, element) {
            if (document.querySelector('.exam-option.selected')) return;

            element.classList.add('selected');

            const q = questions[currentQuestionIndex];
            const isCorrect = optIndex === q.a;

            if (isCorrect) score++;

            userAnswers.push({
                q: q.q,
                userText: q.options[optIndex].substring(0, 1),
                correctText: q.options[q.a].substring(0, 1),
                correctFullPath: q.options[q.a],
                isCorrect: isCorrect,
                exp: q.exp
            });

            document.getElementById('next-btn').style.display = 'block';
        };

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('score-circle').style.setProperty('--percentage', `${percentage}%`);
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;

            const msgEl = document.getElementById('result-message');
            if (percentage === 100) {
                msgEl.textContent = "完璧です！第3章の内容を完全にマスターしましたね！🎉✨";
                msgEl.style.color = "var(--secondary-color)";
                document.getElementById('next-chapter-btn').style.display = 'inline-block';
            } else if (percentage >= 80) {
                msgEl.textContent = "素晴らしい成績です！合格圏内です！👍";
                document.getElementById('next-chapter-btn').style.display = 'inline-block';
            } else if (percentage >= 60) {
                msgEl.textContent = "よく頑張りました！間違えたところを復習しましょう。📝";
            } else {
                msgEl.textContent = "もう一度テキストを読み返して、再チャレンジしましょう！💪";
            }

            const bestScore = parseInt(localStorage.getItem('chapter3_exam_score') || '0');
            if (score > bestScore) {
                localStorage.setItem('chapter3_exam_score', score);
            }

            const listEl = document.getElementById('result-list');
            let html = '<h3>回答の振り返り</h3>';
            userAnswers.forEach((ans, i) => {
                const mark = ans.isCorrect ? '<span class="correct-ans">○ 正解</span>' : '<span class="wrong-ans">× 不正解</span>';
                
                html += `
                    <div class="result-item">
                        <p><strong>問${i + 1}:</strong> ${ans.q}</p>
                        <p style="margin: 0.5rem 0;">あなたの回答: ${ans.userText} | 判定: ${mark}</p>
                        <div class="explanation">
                            <strong>正解: ${ans.correctFullPath}</strong><br>
                            ${ans.exp}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;

            if (percentage >= 80) {
                localStorage.setItem('chapter3_completed', 'true');
                localStorage.setItem('chapter3_section3-exam_completed', 'true');
            }
            window.scrollTo(0, 0);
        }
    </script>
