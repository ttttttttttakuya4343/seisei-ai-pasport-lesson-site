<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ 本試験形式 模擬試験 | 生成AIパスポート講座</title>
    <link rel="stylesheet" href="shared/css/styles.css">
    <style>
        /* ===== 模擬試験専用スタイル ===== */

        /* タイマー */
        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .timer-display {
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .timer-warning {
            color: #ff4444 !important;
            animation: timerPulse 1s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 問題番号ナビ */
        .question-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .q-nav-btn {
            width: 32px;
            height: 32px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-nav-btn.current {
            border-color: #1976d2;
            background: #e3f2fd;
            color: #1976d2;
        }
        .q-nav-btn.answered {
            background: #c8e6c9;
            border-color: #4caf50;
        }
        .q-nav-btn.review-flag {
            background: #fff9c4;
            border-color: #fbc02d;
        }
        .q-nav-btn.current.review-flag {
            background: #fff176;
            border-color: #fbc02d;
        }

        /* プログレスバー */
        .progress-wrap {
            margin-bottom: 1rem;
        }
        .progress-track {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #81c784);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .progress-label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.3rem;
        }

        /* 問題カード */
        .question-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
        }
        .question-number {
            font-size: 1rem;
            color: #1976d2;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .question-text {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: #333;
        }

        /* 選択肢 */
        .exam-option {
            display: block;
            width: 100%;
            padding: 1rem 1.2rem;
            margin-bottom: 0.6rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            font-size: 1rem;
            line-height: 1.6;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .exam-option:hover {
            border-color: #90caf9;
            background: #e3f2fd;
        }
        .exam-option.selected {
            border-color: #1976d2;
            background: #bbdefb;
            font-weight: 700;
        }

        /* ナビボタン */
        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        .exam-nav-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .exam-nav-btn.primary {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
        }
        .exam-nav-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25,118,210,0.4);
        }
        .exam-nav-btn.secondary {
            background: #f5f5f5;
            color: #333;
        }
        .exam-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .review-btn {
            padding: 0.6rem 1rem;
            border: 2px solid #fbc02d;
            border-radius: 8px;
            background: white;
            color: #f57f17;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .review-btn.active {
            background: #fff9c4;
            border-color: #f57f17;
        }

        /* ===== 回答一覧画面 ===== */
        .review-screen {
            display: none;
        }
        .review-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin: 1.5rem 0;
        }
        .review-grid-btn {
            aspect-ratio: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .review-grid-btn.answered {
            background: #c8e6c9;
            border-color: #4caf50;
        }
        .review-grid-btn.review-flag {
            background: #fff176;
            border-color: #fbc02d;
            box-shadow: 0 0 8px rgba(251,192,45,0.5);
        }
        .review-summary {
            text-align: center;
            font-size: 1rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        /* ===== 結果画面 ===== */
        .result-screen {
            display: none;
        }
        .score-display {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            color: white;
            margin-bottom: 2rem;
        }
        .score-big {
            font-size: 3rem;
            font-weight: 900;
        }
        .score-pct {
            font-size: 2rem;
            color: #81c784;
            margin-top: 0.5rem;
        }

        /* スコアサークル */
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(#81c784 var(--percentage, 0%), #333 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            position: relative;
        }
        .score-circle::after {
            content: '';
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1a2e;
            position: absolute;
        }
        .score-circle .score-text {
            position: relative;
            z-index: 1;
            font-size: 1.2rem;
            font-weight: 900;
        }

        /* フィルター */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            margin: 1.5rem 0;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.5rem 1.2rem;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #1976d2;
            color: white;
            border-color: #1976d2;
        }

        /* 回答詳細 */
        .result-item {
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            border-left: 5px solid;
        }
        .result-item[data-correct="true"] {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        .result-item[data-correct="false"] {
            background: #ffebee;
            border-color: #f44336;
        }
        .result-item-header {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        .correct-mark { color: #2e7d32; font-weight: 700; }
        .wrong-mark { color: #c62828; font-weight: 700; }
        .result-q { color: #333; margin-bottom: 0.5rem; line-height: 1.6; }
        .result-answer { color: #555; }
        .result-correct { color: #2e7d32; font-weight: 600; }
        .result-explanation {
            margin-top: 0.8rem;
            padding: 0.8rem;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #555;
        }

        /* ===== ガチャカード ===== */
        .gacha-section {
            margin: 2rem 0;
            text-align: center;
        }
        .gacha-card {
            display: inline-block;
            padding: 2rem;
            border: 3px solid;
            border-radius: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-width: 250px;
            animation: gachaAppear 0.8s ease-out;
        }
        @keyframes gachaAppear {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(-10deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        .gacha-rarity { font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 0.5rem; }
        .gacha-fruit-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 1rem auto;
        }
        .gacha-fruit-name { font-size: 1.3rem; font-weight: 900; margin-top: 0.5rem; }
        .gacha-fruit-type { font-size: 0.9rem; color: #aaa; margin-top: 0.3rem; }
        .gacha-fruit-ability { font-size: 0.9rem; color: #ccc; margin-top: 0.3rem; }

        /* 本格ガチャアニメーション */
        .gacha-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 0;
            position: relative;
            user-select: none;
            min-height: 250px;
        }
        
        .spin-gacha-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            border: 2px solid #fff;
            padding: 1rem 2.5rem;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,152,0,0.5);
            transition: all 0.2s;
            z-index: 20;
            animation: pulseBtn 2s infinite;
        }
        .spin-gacha-btn:active {
            transform: scale(0.95);
        }
        .spin-gacha-btn:disabled {
            background: #ccc;
            animation: none;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        @keyframes pulseBtn {
            0% { box-shadow: 0 4px 15px rgba(255,152,0,0.5); transform: scale(1); }
            50% { box-shadow: 0 4px 25px rgba(255,152,0,0.8); transform: scale(1.05); }
            100% { box-shadow: 0 4px 15px rgba(255,152,0,0.5); transform: scale(1); }
        }

        /* カプセル本体 */
        .gacha-capsule {
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -50px;
            margin-left: -50px;
            opacity: 0;
            transform: scale(0.5) translateY(-50px);
            z-index: 10;
        }
        .capsule-top {
            width: 100px;
            height: 50px;
            background: rgba(255, 69, 0, 0.85);
            border-radius: 50px 50px 0 0;
            border: 3px solid #cc3700;
            border-bottom: none;
            box-shadow: inset 0 8px 15px rgba(255,255,255,0.4);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }
        .capsule-bottom {
            width: 100px;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0 0 50px 50px;
            border: 3px solid #ccc;
            border-top: 2px solid #aaa;
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.1);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: top center;
        }

        /* カプセル出現アニメーション（落下してバウンス） */
        @keyframes dropCapsule {
            0% { opacity: 0; transform: scale(0.5) translateY(-150px) rotate(0deg); }
            40% { opacity: 1; transform: scale(1) translateY(80px) rotate(180deg); }
            60% { transform: scale(1) translateY(30px) rotate(270deg); }
            80% { transform: scale(1) translateY(80px) rotate(360deg); }
            100% { opacity: 1; transform: scale(1.3) translateY(60px) rotate(380deg); }
        }
        
        .gacha-capsule.drop {
            animation: dropCapsule 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        /* カプセルが開く */
        .gacha-capsule.open {
            animation: none;
            opacity: 1;
            transform: scale(1.3) translateY(60px) rotate(380deg);
        }
        .gacha-capsule.open .capsule-top {
            transform: translateY(-60px) rotate(-20deg);
            opacity: 0;
        }
        .gacha-capsule.open .capsule-bottom {
            transform: translateY(60px) rotate(20deg);
            opacity: 0;
        }

        /* 覇気（オーラ）エフェクトと震えアニメーション */
        @keyframes shakeCapsule {
            0% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(0, 0); opacity: 1; }
            10% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(-2px, -2px); opacity: 1; }
            20% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(2px, -2px); opacity: 1; }
            30% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(-2px, 2px); opacity: 1; }
            40% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(2px, 2px); opacity: 1; }
            50% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(-2px, -2px); opacity: 1; }
            60% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(2px, -2px); opacity: 1; }
            70% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(-2px, 2px); opacity: 1; }
            80% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(2px, 2px); opacity: 1; }
            90% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(-2px, -2px); opacity: 1; }
            100% { transform: scale(1.3) translateY(60px) rotate(380deg) translate(0, 0); opacity: 1; }
        }

        .gacha-capsule.charging {
            animation: shakeCapsule 0.1s infinite;
            opacity: 1;
        }

        /* オーラの疑似要素 */
        .gacha-capsule::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(139,0,0,0.4) 40%, transparent 70%);
            opacity: 0;
            z-index: -1;
            mix-blend-mode: screen;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .gacha-capsule.charging::before {
            opacity: 1;
            animation: pulseAura 0.5s infinite alternate;
        }

        /* 閃光エフェクト */
        .light-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,0,0.8) 30%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            mix-blend-mode: screen;
        }
        @keyframes flashLight {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.1) rotate(0deg); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5) rotate(90deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2) rotate(180deg); }
        }
        .light-flash.active {
            animation: flashLight 1s ease-out forwards;
        }

        /* ガチャ結果カードの表示用（既存のgacha-cardを上書きしないよう調整） */
        .real-gacha-card {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 25;
            display: none; /* 初期は非表示 */
        }
        .real-gacha-card.show {
            display: inline-block;
            opacity: 1;
            transform: scale(1);
        }

        /* ===== コレクション ===== */
        .collection-section {
            margin-top: 2rem;
        }
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 1rem;
        }
        .collection-item {
            padding: 0.8rem 0.4rem;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #ddd;
            transition: all 0.2s;
        }
        .collection-item.owned {
            background: #fff;
            border-color: #81c784;
        }
        .collection-item.locked {
            background: #f5f5f5;
            border-color: #e0e0e0;
        }
        .collection-emoji { font-size: 1.8rem; }
        .locked-emoji { filter: grayscale(1); opacity: 0.3; font-size: 1.8rem; }
        .collection-name { font-size: 0.7rem; font-weight: 700; margin-top: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .collection-stars { font-size: 0.6rem; color: #FFD700; }
        .collection-count { font-size: 0.65rem; color: #888; }

        /* ===== 履歴テーブル ===== */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        .history-table th, .history-table td {
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        .history-table th {
            background: #f5f5f5;
            font-weight: 700;
        }
        .history-table tr.pass td:nth-child(4) { color: #2e7d32; font-weight: 700; }
        .history-table tr.fail td:nth-child(4) { color: #c62828; font-weight: 700; }

        /* ===== 開始画面 ===== */
        .start-hero {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            color: white;
            margin-bottom: 2rem;
        }
        .start-hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .start-hero p { color: #aaa; }
        .start-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .info-card {
            background: white;
            padding: 1.2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .info-card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .info-card .label { font-size: 0.85rem; color: #888; }
        .info-card .value { font-size: 1.3rem; font-weight: 900; color: #333; }

        .start-btn-large {
            display: block;
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1.5rem;
        }
        .start-btn-large:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(198,40,40,0.4);
        }

        /* コレクション折り畳み */
        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 10px;
            margin-top: 1.5rem;
        }
        .collapsible-header:hover { background: #eee; }
        .collapsible-content {
            display: none;
            padding: 1rem 0;
        }
        .collapsible-content.open { display: block; }

        /* submit */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(198,40,40,0.4);
        }

        .back-to-review-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        /* 中断ボタン */
        .abort-btn {
            padding: 0.4rem 0.8rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #ff8a80;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .abort-btn:hover {
            background: rgba(198,40,40,0.3);
            border-color: #ff5252;
            color: #ff5252;
        }

        @media (max-width: 600px) {
            .start-info { grid-template-columns: 1fr; }
            .collection-grid { grid-template-columns: repeat(3, 1fr); }
            .review-grid { grid-template-columns: repeat(6, 1fr); }
            .q-nav-btn { width: 28px; height: 28px; font-size: 0.65rem; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 生成AIパスポート講座</h1>
            <div class="nav-links">
                <a href="index.html">ホーム</a>
            </div>
        </div>
    </nav>

    <main class="container lesson-layout">
        <div class="lesson-page" style="width: 100%; max-width: 850px; margin: 0 auto;">

            <!-- ===== 開始画面 ===== -->
            <div id="start-screen">
                <div class="start-hero">
                    <h1>🏴‍☠️ 本試験形式 模擬試験</h1>
                    <p>生成AIパスポート試験の本番と同じ形式で60問に挑戦！</p>
                </div>

                <div class="start-info">
                    <div class="info-card">
                        <div class="icon">📝</div>
                        <div class="label">出題数</div>
                        <div class="value">60問</div>
                    </div>
                    <div class="info-card">
                        <div class="icon">⏱️</div>
                        <div class="label">制限時間</div>
                        <div class="value">60分</div>
                    </div>
                    <div class="info-card">
                        <div class="icon">🎯</div>
                        <div class="label">合格ライン</div>
                        <div class="value">70%</div>
                    </div>
                </div>

                <button id="start-btn" class="start-btn-large">🏴‍☠️ 海に出る（試験を開始する）</button>

                <!-- 履歴 -->
                <div id="start-history" style="margin-top: 2rem;"></div>

                <!-- コレクション -->
                <div class="collapsible-header" onclick="toggleCollapsible(this)">
                    <span style="font-weight: 700;">🍎 悪魔の実コレクション（<span id="collection-count">0 / 30</span>種）</span>
                    <span>▼</span>
                </div>
                <div class="collapsible-content">
                    <div id="collection-grid" class="collection-grid"></div>
                </div>
            </div>

            <!-- ===== 試験画面 ===== -->
            <div id="exam-screen" style="display: none;">
                <!-- タイマーバー -->
                <div class="timer-bar">
                    <span id="q-number" style="font-weight:700;">問 1 / 60</span>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <button type="button" id="abort-btn" class="abort-btn">✕ 中断する</button>
                        <button type="button" id="force-finish-btn" class="abort-btn" style="color:#ffe082; border-color:rgba(255,224,130,0.4); font-size:0.7rem;" title="テスト用：強制的に試験を終了して結果画面を表示">🔧 強制終了</button>
                    </div>
                    <span>⏱️ <span id="timer-display" class="timer-display">60:00</span></span>
                </div>

                <!-- 問題番号ナビ -->
                <div id="question-nav" class="question-nav"></div>

                <!-- プログレス -->
                <div class="progress-wrap">
                    <div class="progress-track">
                        <div id="progress-bar" class="progress-fill" style="width:0%"></div>
                    </div>
                    <div id="progress-text" class="progress-label">0 / 60 問回答済み</div>
                </div>

                <!-- 問題カード -->
                <div class="question-card">
                    <div id="question-text" class="question-text"></div>
                    <div id="options-area"></div>
                </div>

                <!-- ナビボタン -->
                <div class="nav-row">
                    <button id="prev-btn" class="exam-nav-btn secondary">← 前の問題</button>
                    <button id="review-toggle-btn" class="review-btn">🔖 後で見直す</button>
                    <button id="next-btn" class="exam-nav-btn primary">次の問題 →</button>
                </div>
            </div>

            <!-- ===== 回答一覧画面 ===== -->
            <div id="review-screen" class="review-screen">
                <h2 style="text-align: center;">📋 回答一覧</h2>
                <p id="review-summary" class="review-summary"></p>

                <div id="review-grid" class="review-grid"></div>

                <div style="display: flex; gap: 0.5rem; margin-top:1rem;">
                    <div style="width:16px; height:16px; background:#c8e6c9; border:2px solid #4caf50; border-radius:4px;"></div><span style="font-size:0.85rem;">回答済み</span>
                    <div style="width:16px; height:16px; background:#fff176; border:2px solid #fbc02d; border-radius:4px; margin-left:1rem;"></div><span style="font-size:0.85rem;">見直しフラグ</span>
                    <div style="width:16px; height:16px; background:white; border:2px solid #ddd; border-radius:4px; margin-left:1rem;"></div><span style="font-size:0.85rem;">未回答</span>
                </div>

                <button id="submit-exam-btn" class="submit-btn">🏴‍☠️ 提出する！</button>
                <button id="back-to-review-btn" class="back-to-review-btn" onclick="document.getElementById('review-screen').style.display='none'; document.getElementById('exam-screen').style.display='block';">← 問題に戻る</button>
            </div>

            <!-- ===== ガチャ専用画面 ===== -->
            <div id="gacha-screen" style="display: none; text-align: center; padding: 2rem 0;">
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">🎲 悪魔の実ガチャ会場</h2>
                <p style="color:#888; margin-bottom: 2rem;">試験お疲れ様！何が出るかな？</p>
                
                <div id="gacha-result"></div>

                <div id="gacha-back-btn-container" style="display: none; margin-top: 2rem;">
                    <button id="back-from-gacha-btn" class="nav-button secondary">← 試験結果に戻る</button>
                </div>
            </div>

            <!-- ===== 結果画面 ===== -->
            <div id="result-screen" class="result-screen">
                <div class="score-display">
                    <h2>📊 試験結果</h2>
                    <div class="score-circle" id="score-circle" style="--percentage: 0%;">
                        <span class="score-text" id="result-score">0/60</span>
                    </div>
                    <div class="score-pct" id="result-percentage">0%</div>
                    <div id="pass-status" style="margin-top: 0.5rem;"></div>
                    <p id="result-msg" style="font-size: 1.2rem; margin-top: 1rem;"></p>
                    <p style="color:#aaa; margin-top:0.5rem;">所要時間: <span id="result-time">-</span></p>
                </div>

                <!-- ガチャ結果への導線 -->
                <div class="gacha-section" style="text-align: center; margin: 2rem 0; padding: 1.5rem; background: #fff8e1; border-radius: 12px; border: 2px dashed #ffb300;">
                    <h3 style="color: #f57f17; margin-bottom: 0.5rem;">🎲 悪魔の実ガチャ</h3>
                    <p style="color:#666; font-size:0.95rem; margin-bottom: 1rem;">試験を頑張ったご褒美！新しい悪魔の実を引きに行こう！</p>
                    <button id="go-to-gacha-btn" class="exam-nav-btn primary" style="background: linear-gradient(135deg, #ffb300, #ff8f00); font-size: 1.2rem; padding: 1rem 2rem;">
                        🎰 ガチャ会場へ向かう！
                    </button>
                </div>

                <!-- フィルター -->
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">すべて</button>
                    <button class="filter-btn" data-filter="correct">✅ 正解のみ</button>
                    <button class="filter-btn" data-filter="wrong">❌ 不正解のみ</button>
                </div>

                <!-- 回答詳細 -->
                <div id="result-details"></div>

                <!-- 履歴 -->
                <div id="result-history" style="margin-top: 2rem;"></div>

                <!-- ボタン -->
                <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                    <button onclick="location.reload()" class="nav-button">🔄 もう一度挑戦する</button>
                    <a href="index.html" class="nav-button secondary">🏠 ホームへ戻る</a>
                </div>
            </div>

        </div>
    </main>

    <script>
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            content.classList.toggle('open');
            header.querySelector('span:last-child').textContent = content.classList.contains('open') ? '▲' : '▼';
        }
    </script>

    <script src="shared/js/data/full-exam-data.js"></script>
    <script src="shared/js/full-exam-system.js"></script>
    <script src="shared/js/hamburger-menu.js"></script>
</body>

</html>
