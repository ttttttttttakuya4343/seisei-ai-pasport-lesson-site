<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第1章: 模擬試験 | 生成AIパスポート講座</title>
    <link rel="stylesheet" href="../shared/css/styles.css">
    <style>
        .exam-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .exam-question {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .exam-question.active {
            display: block;
        }

        .exam-options {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .exam-option {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .exam-option:hover {
            background: #e9ecef;
        }

        .exam-option.selected {
            /* JS側で正誤に応じて背景色を付与するため、ここでは文字色のみ白にします */
            color: white;
        }

        .exam-progress {
            margin: 2rem 0;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
        }

        .exam-result {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--secondary-color) var(--percentage), #e9ecef 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            font-weight: bold;
            position: relative;
        }

        .score-circle::before {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
        }

        .score-text {
            position: relative;
            z-index: 1;
            color: var(--text-color);
        }

        .explanation {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: left;
            border-left: 4px solid var(--secondary-color);
        }

        .correct-ans {
            color: #2e7d32;
            font-weight: bold;
        }

        .wrong-ans {
            color: #c62828;
            font-weight: bold;
        }

        .result-list {
            margin-top: 2rem;
            text-align: left;
        }

        .result-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }

        .start-screen {
            text-align: center;
            padding: 3rem 0;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 生成AIパスポート講座</h1>
            <div class="nav-links">
                <a href="../index.html">ホーム</a>
                <a href="index.html">第1章トップ</a>
            </div>
        </div>
    </nav>
    <main class="container lesson-layout">
        <div class="lesson-page" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <div class="lesson-header exam-header">
                <div class="hero-badge" style="background-color: var(--secondary-color);">第1章 総合テスト</div>
                <h1>模擬試験</h1>
                <p>第1章の全内容から15問が出題されます。記憶力をチェックしましょう！</p>
                <div id="best-score-display"
                    style="margin-top: 1rem; font-weight: bold; color: var(--secondary-dark); display: none;">
                    🏆 最高スコア: <span id="best-score">0</span>/15
                </div>
            </div>

            <div id="start-screen" class="start-screen">
                <p>準備はいいですか？全問正解を目指して頑張りましょう！</p>
                <button id="start-btn" class="nav-button"
                    style="font-size: 1.2rem; padding: 1rem 2rem;">試験を開始する</button>
            </div>

            <div id="exam-container" style="display: none;">
                <div class="exam-progress">問題 <span id="current-q">1</span> / 15</div>

                <div id="question-area">
                    <!-- 問題がJSで生成されます -->
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="next-btn" class="nav-button" style="display: none;">次の問題へ</button>
                </div>
            </div>

            <div id="result-screen" class="exam-result">
                <h2>試験結果</h2>
                <div class="score-circle" id="score-circle" style="--percentage: 0%;">
                    <span class="score-text" id="final-score">0/15</span>
                </div>
                <h3 id="result-message"></h3>

                <div class="result-list" id="result-list">
                    <h3>回答の振り返り</h3>
                    <!-- 振り返りがJSで生成されます -->
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                    <button onclick="location.reload()" class="nav-button">もう一度挑戦する</button>
                    <a href="../index.html" class="nav-button secondary">ホームへ戻る</a>
                </div>
            </div>
        </div>
    </main>

    <!-- お宝獲得動画モーダル -->
    <div class="treasure-modal-overlay" id="treasure-modal" style="display:none;">
        <div class="treasure-modal">
            <div class="treasure-modal-header">
                <span class="treasure-modal-title">🏆 お宝を回収した！</span>
            </div>
            <div class="treasure-modal-video">
                <button id="sound-toggle-btn" class="sound-toggle-btn" onclick="toggleTreasureSound()">🔇 音声を出す</button>
                <video id="treasure-video" playsinline autoplay muted loop>
                    <source src="../video/hf_20260223_123655_a3d8eab7-8f9a-4341-8421-94cee541bb3a.mp4" type="video/mp4">
                </video>
            </div>
            <div class="treasure-modal-info">
                <img id="treasure-modal-img" src="../shared/images/treasures/chapter1_treasure.jpg" alt="AI知識の火種"
                    class="treasure-modal-thumb">
                <div>
                    <div class="treasure-modal-name" id="treasure-modal-name">AI知識の火種</div>
                    <div class="treasure-modal-desc" id="treasure-modal-desc">古代のデータ結晶が発光する不思議な火起こし道具</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 1.5rem;">
                <button class="nav-button" onclick="closeTreasureModal()">受け取る！</button>
            </div>
        </div>
    </div>

    <script>
        // 全15問のデータ（第1〜4節の内容をカバー）
        const allQuestions = [
            { q: "「人工知能（AI）」という言葉は、1956年にジョン・マッカーシーらが開催したダートマス会議で初めて使用された。", a: true, exp: "1956年のダートマス会議で「Artificial Intelligence」という言葉が誕生し、AI研究がスタートしました。" },
            { q: "第3次AIブームを牽引している主な技術的要因は「機械学習」および「ディープラーニング（深層学習）」である。", a: true, exp: "2010年代からの第3次AIブームは、大量のデータを学習する機械学習やディープラーニングの飛躍的発展によって起きました。" },
            { q: "ディープラーニング（深層学習）の最大の特徴は、データが持つ特徴（特徴量）を人間が手動で設定しなければならない点である。", a: false, exp: "従来の機械学習とは異なり、ディープラーニングはデータから「特徴量」をAI自身が自動的に抽出・学習できるのが最大の特徴です。" },
            { q: "GAN（敵対的生成ネットワーク）は、「生成器」と「識別器」の2つのネットワークが互いに競い合うことで学習する。", a: true, exp: "GANは、偽物を生成する「生成器」とそれを見破る「識別器」が競い合うことで、よりリアルなデータを生成する技術です。" },
            { q: "ニューラルネットワークにおいて、重要な情報を優先的に処理するためにノード間の接続の強さを調整することを「重み付け」と呼ぶ。", a: true, exp: "人間の脳のシナプスの強弱のように、重要な情報を処理する接続の「重み」を調整することを重み付けと呼びます。" },
            { q: "半教師あり学習は、少量の「ラベルありデータ」と大量の「ラベルなしデータ」を組み合わせて効率的に学習する手法である。", a: true, exp: "ラベル付けのコストを削減しつつ、精度を向上させるために「ラベルあり・なし」の両方を組み合わせるハイブリッドな学習手法です。" },
            { q: "強化学習は、AIに「報酬」を与え、試行錯誤を通じてその報酬を最大化するような最適な行動を学習させる枠組みである。", a: true, exp: "ゲームのプレイや自動運転技術などに活用されている、報酬最大化を目指す学習手法が強化学習です。" },
            { q: "過学習（オーバーフィッティング）を回避するための手法として、ドロップアウトや早期終了（Early Stopping）がある。", a: true, exp: "学習データに過剰に適合してしまう過学習を防ぐため、ドロップアウトや早期終了、正則化といった手法が使われます。" },
            { q: "「転移学習」とは、ある領域で学習済みのモデル（知識）を、別の関連する領域の学習に応用して効率化する手法である。", a: true, exp: "一から学習するのではなく、既存のAIの知識を転用（転移）することで、少ないデータでも高い精度を出せる強力な手法です。" },
            { q: "AGI（汎用AI）は、人間のように幅広い知的タスクをこなせるAIであり、現在すでに多くのスマートフォンに搭載されている。", a: false, exp: "AGI（汎用AI）はまだ実現していません。現在普及しているのは特定のタスクに特化したANI（特化型AI）です。" },
            { q: "哲学者のサールが提唱した「強いAI」とは、計算速度が極めて速く、高い処理能力を持つAIのことを指す。", a: false, exp: "「強いAI」は能力の高さではなく、「人間のような心や意識を持っているか」という別の分類軸です。" },
            { q: "「ノーフリーランチ定理」は、あらゆる問題に対して万能で完璧なアルゴリズムは存在しないことを証明した定理である。", a: true, exp: "「何にでも使える完璧なアルゴリズムはない」という定理です。問題の特性に応じて最適な手法を選ぶ必要があります。" },
            { q: "シンギュラリティ（技術的特異点）とは、人工知能が人類の知能を超える転換点のことである。", a: true, exp: "レイ・カーツワイルは、2045年頃にAIが全人類の知能を超えるシンギュラリティが到来すると予測しました（2045年問題）。" },
            { q: "AIの普及により、将来的に人間のすべての仕事がAIに奪われ、新たな雇用は一切生まれなくなると断言されている。", a: false, exp: "AIは定型作業を代替する一方で、AI開発やAI活用サービスなど「新たな雇用・仕事」も生み出すと予測されています。" },
            { q: "「AI効果」とは、AI技術が普及し日常的になると、人々がそれを「単なるプログラム」と感じ、AIとは呼ばなくなる現象である。", a: true, exp: "OCRやウェブ検索など、かつて高度なAIとされたものがコモディティ化し、AIと認識されなくなる心理的現象です。" }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        // シャッフル関数
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            const bestScore = localStorage.getItem('chapter1_exam_score');
            if (bestScore) {
                document.getElementById('best-score-display').style.display = 'block';
                document.getElementById('best-score').textContent = bestScore;
            }

            document.getElementById('start-btn').addEventListener('click', startExam);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
        });

        function startExam() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';

            // 問題をシャッフル
            questions = shuffle([...allQuestions]);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            showQuestion();
        }

        function showQuestion() {
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            const q = questions[currentQuestionIndex];

            const area = document.getElementById('question-area');
            area.innerHTML = `
                <div class="exam-question active">
                    <p style="font-size: 1.2rem; margin-bottom: 1.5rem;"><strong>問題:</strong><br>${q.q}</p>
                    <div class="exam-options">
                        <div class="exam-option" onclick="selectExamAnswer(true, this)">○（正しい）</div>
                        <div class="exam-option" onclick="selectExamAnswer(false, this)">×（誤り）</div>
                    </div>
                    <div id="exam-feedback" style="display: none; margin-top: 1.5rem; padding: 1.5rem; border-radius: 8px; line-height: 1.6;"></div>
                </div>
            `;
            document.getElementById('next-btn').style.display = 'none';
        }

        window.selectExamAnswer = function (answer, element) {
            // 既に選択済みなら無視
            if (document.querySelector('.exam-option.selected')) return;

            // 選択表示
            element.classList.add('selected');

            const q = questions[currentQuestionIndex];
            const isCorrect = answer === q.a;

            const options = element.parentElement.children;

            // 正解・不正解でボタンの色を変える
            if (isCorrect) {
                element.style.backgroundColor = '#4caf50'; // 緑
                element.style.borderColor = '#388e3c';
                score++;
            } else {
                element.style.backgroundColor = '#f44336'; // 赤
                element.style.borderColor = '#d32f2f';
                // 正解のボタンも緑色にする
                const correctIndex = q.a ? 0 : 1;
                options[correctIndex].style.backgroundColor = '#4caf50';
                options[correctIndex].style.color = '#ffffff';
                options[correctIndex].style.borderColor = '#388e3c';
            }

            userAnswers.push({
                q: q.q,
                user: answer,
                correct: q.a,
                exp: q.exp
            });

            // フィードバックの即時表示
            const feedbackEl = document.getElementById('exam-feedback');
            if (isCorrect) {
                feedbackEl.style.backgroundColor = '#e8f5e9';
                feedbackEl.style.borderLeft = '5px solid #4caf50';
                feedbackEl.innerHTML = '<strong style="color: #2e7d32; font-size: 1.2rem;">✅ 大正解だ！</strong><br><br>' + q.exp;
            } else {
                feedbackEl.style.backgroundColor = '#ffebee';
                feedbackEl.style.borderLeft = '5px solid #f44336';
                feedbackEl.innerHTML = '<strong style="color: #c62828; font-size: 1.2rem;">❌ うーん、惜しい！</strong><br><br><strong>正解は「' + (q.a ? '○（正しい）' : '×（誤り）') + '」だ！</strong><br>' + q.exp;
            }
            feedbackEl.style.display = 'block';

            // 次へボタン表示
            document.getElementById('next-btn').style.display = 'inline-block';
        };

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('score-circle').style.setProperty('--percentage', `${percentage}%`);
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;

            const msgEl = document.getElementById('result-message');
            if (percentage === 100) {
                msgEl.textContent = "完璧です！AIのエキスパートですね！🎉✨";
                msgEl.style.color = "var(--secondary-color)";
            } else if (percentage >= 80) {
                msgEl.textContent = "素晴らしい成績です！合格圏内です！👍";
            } else if (percentage >= 60) {
                msgEl.textContent = "よく頑張りました！間違えたところを復習しましょう。📝";
            } else {
                msgEl.textContent = "もう一度テキストを読み返して、再チャレンジしましょう！💪";
            }

            // ハイスコア保存
            const bestScore = parseInt(localStorage.getItem('chapter1_exam_score') || '0');
            if (score > bestScore) {
                localStorage.setItem('chapter1_exam_score', score);
            }

            // 合格ならお宝獲得フラグセット＆演出表示
            if (percentage >= 80) {
                const wasCompleted = localStorage.getItem('chapter1_completed') === 'true';
                localStorage.setItem('chapter1_completed', 'true');
                if (!wasCompleted || localStorage.getItem('treasure_shown_1') !== 'true') {
                    // 初回クリア時にお宝演出
                    localStorage.setItem('treasure_shown_1', 'true');
                    setTimeout(() => {
                        showTreasureModal();
                    }, 1000);
                }
            }

            // 振り返りリスト作成
            const listEl = document.getElementById('result-list');
            let html = '';
            userAnswers.forEach((ans, i) => {
                const isCorrect = ans.user === ans.correct;
                const mark = isCorrect ? '<span class="correct-ans">○ 正解</span>' : '<span class="wrong-ans">× 不正解</span>';
                const userChoice = ans.user ? '○' : '×';
                const correctChoice = ans.correct ? '○' : '×';

                html += `
                    <div class="result-item">
                        <p><strong>問${i + 1}:</strong> ${ans.q}</p>
                        <p style="margin: 0.5rem 0;">あなたの回答: ${userChoice} | 判定: ${mark}</p>
                        <div class="explanation">
                            <strong>正解: ${correctChoice}</strong><br>
                            ${ans.exp}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML += html;

            // 全問解いた＝チャプターテスト完全完了とみなす
            localStorage.setItem('chapter1_exam_completed', 'true');
        }

        function showTreasureModal() {
            const modal = document.getElementById('treasure-modal');
            const video = document.getElementById('treasure-video');
            if (modal && video) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                // モーダル表示時にミュートを解除し最初から再生
                video.muted = false;
                video.currentTime = 0;
                video.play().catch((e) => {
                    console.log("自動再生がブロックされました。ミュートで再生を試みます。", e);
                    video.muted = true;
                    video.play();
                });
            }
        }

        function closeTreasureModal() {
            const modal = document.getElementById('treasure-modal');
            const video = document.getElementById('treasure-video');
            video.pause();
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
    </script>
</body>

</html>
```
