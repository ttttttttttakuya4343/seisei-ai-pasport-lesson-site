<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第1章: 模擬試験 | 生成AIパスポート講座</title>
    <link rel="stylesheet" href="../shared/css/styles.css">

</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 生成AIパスポート講座</h1>
            <div class="nav-links">
                <a href="../index.html">ホーム</a>
                <a href="index.html">第1章トップ</a>
                <a href="index.html">第1章トップ</a>
            </div>
        </div>
    </nav>
    <main class="container lesson-layout">
        <div class="lesson-page" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <div class="lesson-header exam-header">
                <div class="hero-badge" style="background-color: var(--secondary-color);">第1章 総合テスト</div>
                <h1>模擬試験</h1>
                <p>第1章の全内容から15問が出題されます。記憶力をチェックしましょう！</p>
                <div id="best-score-display"
                    style="margin-top: 1rem; font-weight: bold; color: var(--secondary-dark); display: none;">
                    🏆 最高スコア: <span id="best-score">0</span>/15
                </div>
            </div>

            <div id="start-screen" class="start-screen">
                <p>準備はいいですか？全問正解を目指して頑張りましょう！</p>
                <button id="start-btn" class="nav-button"
                    style="font-size: 1.2rem; padding: 1rem 2rem;">試験を開始する</button>
            </div>

            <div id="exam-container" style="display: none;">
                <div class="exam-progress">問題 <span id="current-q">1</span> / 15</div>

                <div id="question-area">
                    <!-- 問題がJSで生成されます -->
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="next-btn" class="nav-button" style="display: none;">次の問題へ</button>
                </div>
            </div>

            <div id="result-screen" class="exam-result">
                <h2>試験結果</h2>
                <div class="score-circle" id="score-circle" style="--percentage: 0%;">
                    <span class="score-text" id="final-score">0/15</span>
                </div>
                <h3 id="result-message"></h3>

                <div class="result-list" id="result-list">
                    <h3>回答の振り返り</h3>
                    <!-- 振り返りがJSで生成されます -->
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                    <button onclick="location.reload()" class="nav-button">もう一度挑戦する</button>
                    <a href="../index.html" class="nav-button secondary">ホームへ戻る</a>
                </div>
            </div>
        </div>
    </main>

    <!-- お宝獲得動画モーダル -->
    <div class="treasure-modal-overlay" id="treasure-modal" style="display:none;">
        <div class="treasure-modal">
            <div class="treasure-modal-header">
                <span class="treasure-modal-title">🏆 お宝を回収した！</span>
            </div>
            <div class="treasure-modal-video">
                <button id="sound-toggle-btn" class="sound-toggle-btn" onclick="toggleTreasureSound()">🔇 音声を出す</button>
                <video id="treasure-video" playsinline autoplay muted loop>
                    <source src="../video/hf_20260223_123655_a3d8eab7-8f9a-4341-8421-94cee541bb3a.mp4" type="video/mp4">
                </video>
            </div>
            <div class="treasure-modal-info">
                <img id="treasure-modal-img" src="../shared/images/treasures/chapter1_treasure.jpg" alt="AI知識の火種"
                    class="treasure-modal-thumb">
                <div>
                    <div class="treasure-modal-name" id="treasure-modal-name">AI知識の火種</div>
                    <div class="treasure-modal-desc" id="treasure-modal-desc">古代のデータ結晶が発光する不思議な火起こし道具</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 1.5rem;">
                <button class="nav-button" onclick="closeTreasureModal()">受け取る！</button>
            </div>
        </div>
    </div>

    <script src="../shared/js/data/chapter1-exam-data.js"></script>
    <script src="../shared/js/exam-system.js"></script>
    <script>
        // 全15問のデータ（第1〜4節の内容をカバー）
                // 外部ファイル（chapter1-exam-data.js）から全問題データを取得
                const allQuestions = window.examQuestionData ? window.examQuestionData.chapter1 : [];
            
                    // 共通試験システムを初期化
                    ExamSystem.init(allQuestions, {
                        chapterNumber: 1,
                        questionCount: 15,
                        passingPercentage: 80,
                        nextChapterLink: '../chapter2/index.html',
                        storageKeyPrefix: 'chapter1',
                        treasureShowKey: 'treasure_shown_1'
                });
    </script>
<script src="../shared/js/hamburger-menu.js"></script>
</body>

</html>
