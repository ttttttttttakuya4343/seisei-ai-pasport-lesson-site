<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第2章: 確認問題 | 生成AIパスポート講座</title>
    <link rel="stylesheet" href="../shared/css/styles.css">
    <style>
        .exam-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .exam-question {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .exam-question.active {
            display: block;
        }

        .exam-options {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .exam-option {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .exam-option:hover {
            background: #e9ecef;
        }

        .exam-option.selected {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-dark);
        }

        .exam-progress {
            margin: 2rem 0;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
        }

        .exam-result {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--secondary-color) var(--percentage), #e9ecef 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            font-weight: bold;
            position: relative;
        }

        .score-circle::before {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
        }

        .score-text {
            position: relative;
            z-index: 1;
            color: var(--text-color);
        }

        .explanation {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: left;
            border-left: 4px solid var(--secondary-color);
        }

        .correct-ans {
            color: #2e7d32;
            font-weight: bold;
        }

        .wrong-ans {
            color: #c62828;
            font-weight: bold;
        }

        .result-list {
            margin-top: 2rem;
            text-align: left;
        }

        .result-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }

        .start-screen {
            text-align: center;
            padding: 3rem 0;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 生成AIパスポート講座</h1>
            <div class="nav-links">
                <a href="../index.html">ホーム</a>
                <a href="index.html">第2章トップ</a>
            </div>
        </div>
    </nav>
    <main class="container lesson-layout">
        <div class="lesson-page" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <div class="lesson-header exam-header">
                <div class="hero-badge" style="background-color: var(--secondary-color);">第2章 確認問題</div>
                <h1>模擬試験</h1>
                <p>第2章の全内容から15問が出題されます。記憶力をチェックしましょう！</p>
                <div id="best-score-display"
                    style="margin-top: 1rem; font-weight: bold; color: var(--secondary-dark); display: none;">
                    🏆 最高スコア: <span id="best-score">0</span>/15
                </div>
            </div>

            <div id="start-screen" class="start-screen">
                <div id="unlock-content">
                    <p style="font-size: 1.1rem; margin-bottom: 2rem;">準備はいいですか？全問正解を目指して頑張りましょう！</p>
                    <button id="start-btn" class="nav-button"
                        style="font-size: 1.2rem; padding: 1rem 2rem;">試験を開始する</button>
                </div>
            </div>

            <div id="exam-container" style="display: none;">
                <div class="exam-progress">問題 <span id="current-q">1</span> / 15</div>

                <div id="question-area">
                    <!-- 問題がJSで生成されます -->
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="next-btn" class="nav-button" style="display: none;">次の問題へ</button>
                </div>
            </div>

            <div id="result-screen" class="exam-result">
                <h2>試験結果</h2>
                <div class="score-circle" id="score-circle" style="--percentage: 0%;">
                    <span class="score-text" id="final-score">0/15</span>
                </div>
                <h3 id="result-message"></h3>

                <div class="result-list" id="result-list">
                    <h3>回答の振り返り</h3>
                    <!-- 振り返りがJSで生成されます -->
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                    <button onclick="location.reload()" class="nav-button">もう一度挑戦する</button>
                    <a href="../chapter3/index.html" id="next-chapter-btn" class="nav-button"
                        style="display:none;">第3章へ進む →</a>
                    <a href="index.html" class="nav-button secondary">第2章トップへ戻る</a>
                </div>
            </div>
        </div>
    </main>

    <!-- お宝獲得動画モーダル -->
    <div class="treasure-modal-overlay" id="treasure-modal" style="display:none;">
        <div class="treasure-modal">
            <div class="treasure-modal-header">
                <span class="treasure-modal-title">🏆 お宝を回収した！</span>
            </div>
            <div class="treasure-modal-video">
                <button id="sound-toggle-btn" class="sound-toggle-btn" onclick="toggleTreasureSound()">🔇 音声を出す</button>
                <video id="treasure-video" playsinline autoplay muted loop>
                    <source src="../video/生成AIの閃光.mp4" type="video/mp4">
                </video>
            </div>
            <div class="treasure-modal-info">
                <img id="treasure-modal-img" src="../shared/images/treasures/chapter2_treasure.jpg" alt="生成AIの閃光"
                    class="treasure-modal-thumb">
                <div>
                    <div class="treasure-modal-name" id="treasure-modal-name">生成AIの閃光</div>
                    <div class="treasure-modal-desc" id="treasure-modal-desc">奇妙な知性の光を放つ古代の機械</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 1.5rem;">
                <button class="nav-button" onclick="closeTreasureModal()">受け取る！</button>
            </div>
        </div>
    </div>

    <script src="../shared/js/data/chapter2-exam-data.js"></script>
    <script>
            // 外部ファイル（chapter2-exam-data.js）から全問題データを取得
            const allQuestions = window.examQuestionData ? window.examQuestionData.chapter2 : [];
        
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
            let userAnswers = [];

            // 出題プールから指定の問題数（ここでは15問）を出題
            const EXAM_QUESTION_COUNT = Math.min(15, allQuestions.length);

        // シャッフル関数
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            // テスト用：URLに ?test=treasure とつけるとお宝演出を強制確認できる
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('test') === 'treasure') {
                showTreasureModal();
                return;
            }

            const bestScore = localStorage.getItem('chapter2_exam_score');
            if (bestScore) {
                document.getElementById('best-score-display').style.display = 'block';
                document.getElementById('best-score').textContent = bestScore;
            }

            document.getElementById('start-btn').addEventListener('click', startExam);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
        });

        function startExam() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';

            // 18問から15問をランダムに選ぶ
            questions = shuffle([...allQuestions]).slice(0, EXAM_QUESTION_COUNT);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            showQuestion();
        }

        function showQuestion() {
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            const q = questions[currentQuestionIndex];

            const area = document.getElementById('question-area');
            area.innerHTML = `
                <div class="exam-question active">
                    <p style="font-size: 1.2rem; margin-bottom: 1.5rem;"><strong>問題:</strong><br>${q.q}</p>
                    <div class="exam-options">
                        <div class="exam-option" onclick="selectExamAnswer(true, this)">○（正しい）</div>
                        <div class="exam-option" onclick="selectExamAnswer(false, this)">×（誤り）</div>
                    </div>
                    <div id="exam-feedback" style="display: none; margin-top: 1.5rem; padding: 1.5rem; border-radius: 8px; line-height: 1.6;"></div>
                </div>
            `;
            document.getElementById('next-btn').style.display = 'none';
            window.scrollTo(0, 0);
        }

        window.selectExamAnswer = function (answer, element) {
            // 既に選択済みなら無視
            if (document.querySelector('.exam-option.selected')) return;

            // 選択表示
            element.classList.add('selected');

            const q = questions[currentQuestionIndex];
            const isCorrect = answer === q.a;
            const options = element.parentElement.children;

            // 正解・不正解でボタンの色を変える
            if (isCorrect) {
                element.style.backgroundColor = '#4caf50'; // 緑
                element.style.borderColor = '#388e3c';
                score++;
            } else {
                element.style.backgroundColor = '#f44336'; // 赤
                element.style.borderColor = '#d32f2f';
                // 正解のボタンも緑色にする
                const correctIndex = q.a ? 0 : 1;
                options[correctIndex].style.backgroundColor = '#4caf50';
                options[correctIndex].style.color = '#ffffff';
                options[correctIndex].style.borderColor = '#388e3c';
            }

            userAnswers.push({
                q: q.q,
                user: answer,
                correct: q.a,
                exp: q.exp
            });

            // フィードバックの即時表示
            const feedbackEl = document.getElementById('exam-feedback');
            if (isCorrect) {
                feedbackEl.style.backgroundColor = '#e8f5e9';
                feedbackEl.style.borderLeft = '5px solid #4caf50';
                feedbackEl.innerHTML = '<strong style="color: #2e7d32; font-size: 1.2rem;">✅ 大正解だ！</strong><br><br>' + q.exp;
            } else {
                feedbackEl.style.backgroundColor = '#ffebee';
                feedbackEl.style.borderLeft = '5px solid #f44336';
                feedbackEl.innerHTML = '<strong style="color: #c62828; font-size: 1.2rem;">❌ うーん、惜しい！</strong><br><br><strong>正解は「' + (q.a ? '○（正しい）' : '×（誤り）') + '」だ！</strong><br>' + q.exp;
            }
            feedbackEl.style.display = 'block';

            // 次へボタン表示
            document.getElementById('next-btn').style.display = 'inline-block';
        };

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('score-circle').style.setProperty('--percentage', `${percentage}%`);
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;

            const msgEl = document.getElementById('result-message');
            // 合格ライン80%なので12問以上
            if (percentage === 100) {
                msgEl.textContent = "完璧です！第2章の内容を完全にマスターしましたね！🎉✨";
                msgEl.style.color = "var(--secondary-color)";
                document.getElementById('next-chapter-btn').style.display = 'inline-block';
            } else if (percentage >= 80) {
                msgEl.textContent = "素晴らしい成績です！合格圏内です！👍";
                document.getElementById('next-chapter-btn').style.display = 'inline-block';
            } else if (percentage >= 60) {
                msgEl.textContent = "よく頑張りました！間違えたところを復習しましょう。📝";
            } else {
                msgEl.textContent = "もう一度テキストを読み返して、再チャレンジしましょう！💪";
            }

            // ハイスコア保存
            const bestScore = parseInt(localStorage.getItem('chapter2_exam_score') || '0');
            if (score > bestScore) {
                localStorage.setItem('chapter2_exam_score', score);
            }

            // 合格ならお宝獲得フラグセット＆演出表示
            if (percentage >= 80) {
                const wasCompleted = localStorage.getItem('chapter2_completed') === 'true';
                localStorage.setItem('chapter2_completed', 'true');
                localStorage.setItem('chapter2_section2-4_completed', 'true');
                if (!wasCompleted || localStorage.getItem('treasure_shown_2') !== 'true') {
                    // 初回クリア時にお宝演出
                    localStorage.setItem('treasure_shown_2', 'true');
                    setTimeout(() => {
                        showTreasureModal();
                    }, 1000);
                }
            }

            // 振り返りリスト作成
            const listEl = document.getElementById('result-list');
            let html = '<h3>回答の振り返り</h3>';
            userAnswers.forEach((ans, i) => {
                const isCorrect = ans.user === ans.correct;
                const mark = isCorrect ? '<span class="correct-ans">○ 正解</span>' : '<span class="wrong-ans">× 不正解</span>';
                const userChoice = ans.user ? '○' : '×';
                const correctChoice = ans.correct ? '○' : '×';

                html += `
                    <div class="result-item">
                        <p><strong>問${i + 1}:</strong> ${ans.q}</p>
                        <p style="margin: 0.5rem 0;">あなたの回答: ${userChoice} | 判定: ${mark}</p>
                        <div class="explanation">
                            <strong>正解: ${correctChoice}</strong><br>
                            ${ans.exp}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function toggleTreasureSound() {
            const video = document.getElementById('treasure-video');
            const btn = document.getElementById('sound-toggle-btn');
            if (video && btn) {
                if (video.muted) {
                    video.muted = false;
                    btn.innerHTML = '🔊 音声を消す';
                } else {
                    video.muted = true;
                    btn.innerHTML = '🔇 音声を出す';
                }
            }
        }

        function showTreasureModal() {
            const modal = document.getElementById('treasure-modal');
            const video = document.getElementById('treasure-video');
            const btn = document.getElementById('sound-toggle-btn');
            if (modal && video) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                // 初期状態セット
                video.muted = false;
                video.currentTime = 0;
                if (btn) btn.innerHTML = '🔊 音声を消す';

                video.play().catch((e) => {
                    console.log("自動再生がブロックされました。ミュートで再生を試みます。", e);
                    video.muted = true;
                    if (btn) btn.innerHTML = '🔇 音声を出す';
                    video.play();
                });
            }
        }

        function closeTreasureModal() {
            const modal = document.getElementById('treasure-modal');
            const video = document.getElementById('treasure-video');
            if (modal && video) {
                video.pause();
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }
        }
    </script>
</body>

</html>
