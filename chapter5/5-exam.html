<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第5章: 模擬試験 | 生成AIパスポート講座</title>
    <link rel="stylesheet" href="../shared/css/styles.css">
    <style>
        .exam-header { text-align: center; margin-bottom: 2rem; }
        .exam-question { background: white; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); display: none; }
        .exam-question.active { display: block; }
        .exam-options { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .exam-option { padding: 1rem; text-align: left; background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: all 0.2s; }
        .exam-option:hover { background: #e9ecef; }
        .exam-option.selected { background: var(--primary-color); color: white; border-color: var(--primary-dark); }
        .exam-progress { margin: 2rem 0; font-size: 1.2rem; text-align: center; font-weight: bold; color: var(--primary-color); }
        .exam-result { text-align: center; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--secondary-color) var(--percentage), #e9ecef 0); display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; font-size: 2rem; font-weight: bold; position: relative; }
        .score-circle::before { content: ""; position: absolute; width: 120px; height: 120px; background: white; border-radius: 50%; }
        .score-text { position: relative; z-index: 1; color: var(--text-color); }
        .explanation { background: #f8f9fa; padding: 1rem; border-radius: 8px; margin-top: 1rem; text-align: left; border-left: 4px solid var(--secondary-color); }
        .correct-ans { color: #2e7d32; font-weight: bold; }
        .wrong-ans { color: #c62828; font-weight: bold; }
        .result-list { margin-top: 2rem; text-align: left; }
        .result-item { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
        .start-screen { text-align: center; padding: 3rem 0; }
        .exam-option.correct { background: #d4edda; color: #155724; border-color: #c3e6cb; }
        .exam-option.incorrect { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        .exam-option.show-answer { border: 2px dashed #28a745; position: relative; }
        .exam-option.show-answer::after { content: "✓ 正解"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #28a745; font-weight: bold; }
        .question-feedback { display: none; margin-top: 1.5rem; padding: 1.5rem; border-radius: 8px; background: #f8f9fa; animation: fadeIn 0.5s ease-out; }
        .question-feedback.correct { border-left: 5px solid #28a745; background: #e8f5e9; }
        .question-feedback.incorrect { border-left: 5px solid #dc3545; background: #ffebee; }
        .feedback-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
        .correct .feedback-title { color: #28a745; }
        .incorrect .feedback-title { color: #dc3545; }
        .feedback-explanation { font-size: 1rem; line-height: 1.5; color: #333; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 生成AIパスポート講座</h1>
            <div class="nav-links">
                <a href="../index.html">ホーム</a>
                <a href="index.html">第5章トップ</a>
            </div>
        </div>
    </nav>
    <main class="container lesson-layout">
        <div class="lesson-page" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <div class="lesson-header exam-header">
                <div class="hero-badge" style="background-color: var(--secondary-color);">第5章 確認問題</div>
                <h1>模擬試験</h1>
                <p>第5章の全内容から20問が出題されます。記憶力をチェックしましょう！</p>
                <div id="best-score-display" style="margin-top: 1rem; font-weight: bold; color: var(--secondary-dark); display: none;">
                    🏆 最高スコア: <span id="best-score">0</span>/20
                </div>
            </div>

            <div id="start-screen" class="start-screen">
                <div id="unlock-content">
                    <p>準備はいいですか？プロンプトエンジニアリングやリスクに関する重要な問題が出題されます！</p>
                    <button id="start-btn" class="nav-button" style="font-size: 1.2rem; padding: 1rem 2rem;">試験を開始する</button>
                </div>
            </div>

            <div id="exam-container" style="display: none;">
                <div class="exam-progress">問題 <span id="current-q">1</span> / 20</div>

                <div id="question-area">
                    <!-- 問題がJSで生成されます -->
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button id="next-btn" class="nav-button" style="display: none;">次の問題へ</button>
                </div>
            </div>

            <div id="result-screen" class="exam-result">
                <h2>試験結果</h2>
                <div class="score-circle" id="score-circle" style="--percentage: 0%;">
                    <span class="score-text" id="final-score">0/20</span>
                </div>
                <h3 id="result-message"></h3>

                <div class="result-list" id="result-list">
                    <h3>回答の振り返り</h3>
                    <!-- 振り返りがJSで生成されます -->
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                    <button onclick="location.reload()" class="nav-button">もう一度挑戦する</button>
                    <a href="../index.html" id="next-chapter-btn" class="nav-button" style="display:none;">受講完了・トップへ →</a>
                    <a href="index.html" class="nav-button secondary">第5章トップへ戻る</a>
                </div>
            </div>

            <!-- お宝獲得動画モーダル -->
            <div class="treasure-modal-overlay" id="treasure-modal" style="display:none;">
                <div class="treasure-modal">
                    <div class="treasure-modal-header">
                        <span class="treasure-modal-title">🏆 お宝を回収した！</span>
                    </div>
                    <div class="treasure-modal-video">
                        <button id="sound-toggle-btn" class="sound-toggle-btn" onclick="toggleTreasureSound()">🔇 音声を出す</button>
                        <video id="treasure-video" playsinline autoplay muted loop>
                            <source src="../shared/assets/chapter5_treasure.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="treasure-modal-info">
                        <img id="treasure-modal-img" src="../shared/images/treasures/chapter5_treasure.jpg" alt="プロンプトの秘宝"
                            class="treasure-modal-thumb">
                        <div>
                            <div class="treasure-modal-name" id="treasure-modal-name">プロンプトの秘宝</div>
                            <div class="treasure-modal-desc" id="treasure-modal-desc">AIを自在に操る魔法の言葉が刻まれた古代の書</div>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="nav-button" onclick="closeTreasureModal()">受け取る！</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const allQuestions = ${JSON.stringify(allData, null, 4)};

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        const EXAM_QUESTION_COUNT = 20;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const bestScore = localStorage.getItem('chapter5_exam_score');
            if (bestScore) {
                document.getElementById('best-score-display').style.display = 'block';
                document.getElementById('best-score').textContent = bestScore;
            }

            document.getElementById('start-btn').addEventListener('click', startExam);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
        });

        function startExam() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';

            questions = shuffle([...allQuestions]).slice(0, EXAM_QUESTION_COUNT);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            showQuestion();
        }

        function showQuestion() {
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            const q = questions[currentQuestionIndex];

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += \`<div class="exam-option" onclick="selectExamAnswer(\${idx}, this)">\${opt}</div>\`;
            });

            const area = document.getElementById('question-area');
            area.innerHTML = \`
                <div class="exam-question active">
                    <p style="font-size: 1.2rem; margin-bottom: 1.5rem;"><strong>問題:</strong><br>\${q.q}</p>
                    <div class="exam-options">
                        \${optionsHtml}
                    </div>
                    <div id="feedback-area" class="question-feedback">
                        <div class="feedback-title" id="feedback-title"></div>
                        <div class="feedback-explanation" id="feedback-explanation"></div>
                    </div>
                </div>
            \`;
            document.getElementById('next-btn').style.display = 'none';
            window.scrollTo(0, 0);
        }

        window.selectExamAnswer = function (optIndex, element) {
            if (document.querySelector('.exam-option.selected')) return;

            element.classList.add('selected');

            const q = questions[currentQuestionIndex];
            const isCorrect = optIndex === q.a;

            if (isCorrect) score++;

            // フィードバックの表示
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackExp = document.getElementById('feedback-explanation');
            const options = document.querySelectorAll('.exam-option');

            if (isCorrect) {
                element.classList.add('correct');
                feedbackTitle.textContent = "🎉 正解！";
                feedbackArea.classList.add('correct');
            } else {
                element.classList.add('incorrect');
                feedbackTitle.textContent = "❌ 残念...";
                feedbackArea.classList.add('incorrect');
                options[q.a].classList.add('show-answer');
            }

            feedbackExp.innerHTML = \`<p style="margin-top: 0.5rem; font-weight: bold;">正解: \${q.options[q.a]}</p><p style="margin-top: 0.5rem;">\${q.exp}</p>\`;
            feedbackArea.style.display = 'block';

            userAnswers.push({
                q: q.q,
                userText: q.options[optIndex].substring(0, 1),
                correctText: q.options[q.a].substring(0, 1),
                correctFullPath: q.options[q.a],
                isCorrect: isCorrect,
                exp: q.exp
            });

            document.getElementById('next-btn').style.display = 'block';
        };

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('score-circle').style.setProperty('--percentage', \`\${percentage}%\`);
            document.getElementById('final-score').textContent = \`\${score}/\${questions.length}\`;

            const msgEl = document.getElementById('result-message');
            if (percentage === 100) {
                msgEl.textContent = "完璧です！第5章の内容を完全にマスターしましたね！🎉✨";
                msgEl.style.color = "var(--secondary-color)";
                document.getElementById('next-chapter-btn').style.display = 'inline-block';
            } else if (percentage >= 80) {
                msgEl.textContent = "素晴らしい成績です！合格圏内です！👍";
                document.getElementById('next-chapter-btn').style.display = 'inline-block';
            } else if (percentage >= 60) {
                msgEl.textContent = "よく頑張りました！間違えたところを復習しましょう。📝";
            } else {
                msgEl.textContent = "もう一度テキストを読み返して、再チャレンジしましょう！💪";
            }

            const bestScore = parseInt(localStorage.getItem('chapter5_exam_score') || '0');
            if (score > bestScore) {
                localStorage.setItem('chapter5_exam_score', score);
            }

            const listEl = document.getElementById('result-list');
            let html = '<h3>回答の振り返り</h3>';
            userAnswers.forEach((ans, i) => {
                const mark = ans.isCorrect ? '<span class="correct-ans">○ 正解</span>' : '<span class="wrong-ans">× 不正解</span>';
                
                html += \`
                    <div class="result-item">
                        <p><strong>問\${i + 1}:</strong> \${ans.q}</p>
                        <p style="margin: 0.5rem 0;">あなたの回答: \${ans.userText} | 判定: \${mark}</p>
                        <div class="explanation">
                            <strong>正解: \${ans.correctFullPath}</strong><br>
                            \${ans.exp}
                        </div>
                    </div>
                \`;
            });
            listEl.innerHTML = html;

            // 合格ならお宝獲得フラグセット＆演出表示
            if (percentage >= 80) {
                const wasCompleted = localStorage.getItem('chapter5_completed') === 'true';
                localStorage.setItem('chapter5_completed', 'true');
                localStorage.setItem('chapter5_section5-exam_completed', 'true');

                if (!wasCompleted || localStorage.getItem('treasure_shown_5') !== 'true') {
                    // 初回クリア時にお宝演出
                    localStorage.setItem('treasure_shown_5', 'true');
                    setTimeout(() => {
                        showTreasureModal();
                    }, 1000);
                }
            }
            window.scrollTo(0, 0);
        }

        function showTreasureModal() {
            const modal = document.getElementById('treasure-modal');
            const video = document.getElementById('treasure-video');
            if (modal && video) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                // モーダル表示時にミュートを解除し最初から再生
                video.muted = false;
                video.currentTime = 0;
                video.play().catch((e) => {
                    console.log("自動再生がブロックされました。ミュートで再生を試みます。", e);
                    video.muted = true;
                    video.play();
                });
            }
        }

        function closeTreasureModal() {
            const modal = document.getElementById('treasure-modal');
            const video = document.getElementById('treasure-video');
            if (video) video.pause();
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }
        }

        function toggleTreasureSound() {
            const video = document.getElementById('treasure-video');
            const btn = document.getElementById('sound-toggle-btn');
            if (video.muted) {
                video.muted = false;
                btn.textContent = '🔊 音声を消す';
            } else {
                video.muted = true;
                btn.textContent = '🔇 音声を出す';
            }
        }
    </script>
</body>
</html>
